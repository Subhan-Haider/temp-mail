version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: synthetic_data
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://myuser:mypassword@db:5432/synthetic_data
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DOMAINS=tmp.subhan.tech,tmp.codelens.site,tmp.codiner.online
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app

  worker:
    build:
      context: ./backend
    command: celery -A worker.celery_app worker -B --loglevel=info
    environment:
      - DATABASE_URL=postgresql://myuser:mypassword@db:5432/synthetic_data
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DOMAINS=tmp.subhan.tech,tmp.codelens.site,tmp.codiner.online
    depends_on:
      - db
      - redis
      - backend
    volumes:
      - ./backend:/app

  smtp:
    build:
      context: ./backend
    command: python smtp_server.py
    ports:
      - "25:25"
    environment:
      - DATABASE_URL=postgresql://myuser:mypassword@db:5432/synthetic_data
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://70.64.105.215:8000
    depends_on:
      - backend

volumes:
  postgres_data:
